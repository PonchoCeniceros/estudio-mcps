<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 780" width="920" height="780">
  <title>Flujo de una llamada MCP, de la pregunta a la respuesta</title>
  <defs>
    <style>
      .title{font:700 17px Georgia,'Iowan Old Style',serif;fill:#1f2328}
      .sub{font:italic 13px Georgia,'Iowan Old Style',serif;fill:#4a4a4a}
      .col{font:11px Menlo,Consolas,monospace;letter-spacing:2px;fill:#6b6b6b}
      .h{font:700 12.5px Georgia,'Iowan Old Style',serif}
      .m{font:10.5px Menlo,Consolas,monospace}
      .it{font:italic 11.5px Georgia,'Iowan Old Style',serif;fill:#4a4a4a}
      .ph{font:700 11px Georgia,'Iowan Old Style',serif;fill:#6b6b6b}
      .phs{font:italic 10.5px Georgia,'Iowan Old Style',serif;fill:#8c8c8c}
      .cap{font:italic 11.5px Georgia,'Iowan Old Style',serif;fill:#4a4a4a}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="920" height="780" fill="#ffffff"/>
  <rect x="10" y="10" width="900" height="760" rx="8" fill="#ffffff" stroke="#d9d5cc"/>
  <text x="34" y="44" class="title">Flujo de una llamada</text>
  <text x="34" y="66" class="sub">De la pregunta a la respuesta. Solo lo que va en terracota es MCP; lo demás es tu aplicación y la API de Claude.</text>
  <g stroke="#8c8c8c" fill="none"><path d="M165,92 V86 H595 V92"/></g>
  <text x="380" y="82" text-anchor="middle" class="col">AGENTE</text>
  <rect x="22" y="200" width="876" height="122" rx="4" fill="#faf8f3"/>
  <rect x="22" y="334" width="876" height="86" rx="4" fill="#faf8f3"/>
  <rect x="22" y="432" width="876" height="170" rx="4" fill="#faf8f3"/>
  <rect x="22" y="614" width="876" height="110" rx="4" fill="#faf8f3"/>
  <line x1="85" y1="130" x2="85" y2="736" stroke="#b5b0a6" stroke-dasharray="4 4"/>
  <line x1="230" y1="130" x2="230" y2="736" stroke="#b5b0a6" stroke-dasharray="4 4"/>
  <line x1="380" y1="130" x2="380" y2="736" stroke="#b5b0a6" stroke-dasharray="4 4"/>
  <line x1="530" y1="130" x2="530" y2="736" stroke="#b5b0a6" stroke-dasharray="4 4"/>
  <line x1="680" y1="130" x2="680" y2="736" stroke="#b5b0a6" stroke-dasharray="4 4"/>
  <line x1="830" y1="130" x2="830" y2="736" stroke="#b5b0a6" stroke-dasharray="4 4"/>
  <rect x="23" y="100" width="124" height="30" rx="4" fill="#fff" stroke="#555" stroke-width="1.3"/>
  <text x="85" y="120" text-anchor="middle" class="h" fill="#1f2328">Usuario</text>
  <rect x="168" y="100" width="124" height="30" rx="4" fill="#fff" stroke="#555" stroke-width="1.3"/>
  <text x="230" y="120" text-anchor="middle" class="h" fill="#1f2328">Claude (LLM)</text>
  <rect x="318" y="100" width="124" height="30" rx="4" fill="#fff" stroke="#555" stroke-width="1.3"/>
  <text x="380" y="120" text-anchor="middle" class="h" fill="#1f2328">Mi aplicación</text>
  <rect x="468" y="100" width="124" height="30" rx="4" fill="#e6edf5" stroke="#4b6b8c" stroke-width="1.3"/>
  <text x="530" y="120" text-anchor="middle" class="h" fill="#2c4a6b">MCP Client</text>
  <rect x="618" y="100" width="124" height="30" rx="4" fill="#e3f1ec" stroke="#2f7d6d" stroke-width="1.3"/>
  <text x="680" y="120" text-anchor="middle" class="h" fill="#1f5c50">MCP Server</text>
  <rect x="768" y="100" width="124" height="30" rx="4" fill="#f7e9df" stroke="#a0522d" stroke-width="1.3"/>
  <text x="830" y="120" text-anchor="middle" class="h" fill="#8a3f1d">Recurso</text>
  <rect x="770" y="204" width="122" height="32" fill="#faf8f3"/>
  <text x="890" y="216" text-anchor="end" class="ph">1 · descubrir</text>
  <text x="890" y="230" text-anchor="end" class="phs">qué tools hay</text>
  <rect x="770" y="338" width="122" height="32" fill="#faf8f3"/>
  <text x="890" y="350" text-anchor="end" class="ph">2 · decidir</text>
  <text x="890" y="364" text-anchor="end" class="phs">el modelo elige</text>
  <rect x="770" y="436" width="122" height="32" fill="#faf8f3"/>
  <text x="890" y="448" text-anchor="end" class="ph">3 · ejecutar</text>
  <text x="890" y="462" text-anchor="end" class="phs">el servidor la corre</text>
  <rect x="770" y="618" width="122" height="32" fill="#faf8f3"/>
  <text x="890" y="630" text-anchor="end" class="ph">4 · responder</text>
  <text x="890" y="644" text-anchor="end" class="phs">el modelo redacta</text>
  <rect x="196" y="368" width="68" height="20" rx="10" fill="#ffffff" stroke="#b5b0a6"/>
  <text x="230" y="382" text-anchor="middle" class="it">(decide)</text>
  <rect x="196" y="648" width="68" height="20" rx="10" fill="#ffffff" stroke="#b5b0a6"/>
  <text x="230" y="662" text-anchor="middle" class="it">(redacta)</text>
  <line x1="88" y1="176" x2="377" y2="176" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="232.5" y="170" text-anchor="middle" class="it">“¿qué repos tengo?”</text>
  <line x1="383" y1="222" x2="527" y2="222" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="455.0" y="216" text-anchor="middle" class="it">list_tools()</text>
  <line x1="533" y1="248" x2="677" y2="248" stroke="#a0522d" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="543.2" y="238" width="123.6" height="20" rx="2" fill="#f7e9df" stroke="#a0522d"/>
  <text x="605.0" y="252" text-anchor="middle" class="m" fill="#8a3f1d">ListToolsRequest</text>
  <line x1="677" y1="278" x2="533" y2="278" stroke="#a0522d" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="546.5" y="268" width="117.0" height="20" rx="2" fill="#f7e9df" stroke="#a0522d"/>
  <text x="605.0" y="282" text-anchor="middle" class="m" fill="#8a3f1d">ListToolsResult</text>
  <line x1="527" y1="306" x2="383" y2="306" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="455.0" y="300" text-anchor="middle" class="it">las tools</text>
  <line x1="377" y1="354" x2="233" y2="354" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="253.1" y="344" width="103.8" height="20" rx="2" fill="#f3ecd9" stroke="#a08a4d"/>
  <text x="305.0" y="358" text-anchor="middle" class="m" fill="#5e4d1f">query + tools</text>
  <line x1="233" y1="404" x2="377" y2="404" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="272.9" y="394" width="64.2" height="20" rx="2" fill="#f3ecd9" stroke="#a08a4d"/>
  <text x="305.0" y="408" text-anchor="middle" class="m" fill="#5e4d1f">ToolUse</text>
  <line x1="383" y1="452" x2="527" y2="452" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="455.0" y="446" text-anchor="middle" class="it">call_tool(nombre, args)</text>
  <line x1="533" y1="478" x2="677" y2="478" stroke="#a0522d" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="546.5" y="468" width="117.0" height="20" rx="2" fill="#f7e9df" stroke="#a0522d"/>
  <text x="605.0" y="482" text-anchor="middle" class="m" fill="#8a3f1d">CallToolRequest</text>
  <line x1="683" y1="504" x2="827" y2="504" stroke="#a0522d" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="755.0" y="498" text-anchor="middle" class="it">llama a la API</text>
  <line x1="827" y1="530" x2="683" y2="530" stroke="#a0522d" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="755.0" y="524" text-anchor="middle" class="it">datos</text>
  <line x1="677" y1="558" x2="533" y2="558" stroke="#a0522d" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="549.8" y="548" width="110.4" height="20" rx="2" fill="#f7e9df" stroke="#a0522d"/>
  <text x="605.0" y="562" text-anchor="middle" class="m" fill="#8a3f1d">CallToolResult</text>
  <line x1="527" y1="586" x2="383" y2="586" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="455.0" y="580" text-anchor="middle" class="it">el resultado</text>
  <line x1="377" y1="632" x2="233" y2="632" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="259.7" y="622" width="90.6" height="20" rx="2" fill="#f3ecd9" stroke="#a08a4d"/>
  <text x="305.0" y="636" text-anchor="middle" class="m" fill="#5e4d1f">tool_result</text>
  <line x1="233" y1="682" x2="377" y2="682" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="305.0" y="676" text-anchor="middle" class="it">“tus repos son…”</text>
  <line x1="377" y1="710" x2="88" y2="710" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="232.5" y="704" text-anchor="middle" class="it">la respuesta</text>
  <text x="34" y="758" class="cap">El modelo nunca habla con el servidor: pide la tool, la aplicación la ejecuta vía el cliente y le devuelve el resultado.</text>
</svg>
